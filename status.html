<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order status — Xion's Micro Tools</title>
  <link rel="stylesheet" href="css/style.css">
  <script>(function(){try{var t=localStorage.getItem("cr.theme");if(!t)t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <span class="brand">⚙️ Xion's Micro Tools</span>
      <span class="spacer"></span>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
      <a href="index.html">Home</a>
      <a href="index.html#tools">Tools</a>
    </nav>

    <section class="section" data-status>
      <h2>Order status</h2>
      <p class="muted">Loading…</p>
    </section>

    <footer>Questions? Message the founder from your checkout page.</footer>
  </div>
  <script src="js/qr.js"></script>
  <script src="js/store.js"></script>
</body>
</html>
