    price_usd: 15
    chains: [eth, sol, btc]
    default_chain: eth
    release_file: "telegram-broadcaster-v1.0.1.zip"
    landing: "/tools/telegram-broadcaster/"
    checkout: "/tools/telegram-broadcaster/checkout.html"
  citation-monitor-weekly-digest:
    name: "Citation Monitor — Weekly Digest"
    blurb: "Every week an agent asks AI engines 36 real buyer questions about your category and emails you: where you're cited, where competitors win, and the 3 changes that flip it."
    price_usd: 19
    chains: [eth, sol, btc]
    default_chain: eth
