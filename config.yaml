  citation-monitor-agency:
    name: "Citation Monitor — Agency (3 brands)"
    blurb: "The weekly AI-visibility digest for a whole client roster: 3 brands tracked in parallel, per-brand sections in one Monday report."
    price_usd: 39
    chains: [eth, sol, btc]
    default_chain: eth
    delivery: email
    billing: monthly
    landing: "/tools/citation-monitor-agency/"
    checkout: "/tools/citation-monitor-agency/checkout.html"
    delivery_note: "3 brand digests delivered by email every Monday (agent-run); per-brand sections; first report within 7 days of payment."

  citation-audit-once:
    name: "AI Visibility Audit — One-Time (36 questions)"
    blurb: "A one-time 36-question AI visibility audit across two engines: exact answers, competitor gaps, quoted sources, and three ranked fixes — emailed as a self-contained HTML report in 3 business days."
