# ============================================================================
# Cash Register — configuration
# ----------------------------------------------------------------------------
# Receiving addresses are configured (BTC / SOL / native-ETH-on-Base).
# Remaining human steps: see LAUNCH_CHECKLIST.md.
#
# ASSET POLICY: this store accepts ONLY decentralized, non-freezable assets —
# native BTC, native ETH (on an L2), native SOL. Centralized stablecoins
# (USDT, USDC, and any issuer-controlled token) are banned from OUR payment
# flow: a handful of issuer/multisig keys can freeze them.
#
# The file is parsed by payments/config.py, a tiny YAML-subset parser.
# Keep the format exactly as shown: `key: value`, 2-space indents for
# nesting, `#` comments, optional quotes on strings, [a, b] inline lists.
# ============================================================================

store:
  name: "Xion's Micro Tools"
  tagline: "Tiny paid tools for indie devs and crypto freelancers"
  url: "https://itsxwang.github.io/cash-register/"   # live after Pages is enabled
  contact_email: "xion.dev7@gmail.com"

# ---------------------------------------------------------------------------
# Receiving addresses (decentralized assets only: BTC / ETH / SOL, native)
# ---------------------------------------------------------------------------
addresses:
  btc: "bc1qrqsg3jfedsljtnuhp5vw4cpgmxj6myvfd7ryhp"
  sol: "9kAAxiK2jc2DgZojDhkkQ7dQhTVbyyWQThMXLecaLtGt"
  eth: "0x45DF2a94A66B948CFd167EE60d3cA682ba61d575"   # native ETH, Base L2
  eth_chain_id: 8453                   # 8453 = Base (native ETH transfers)
  eth_chain_name: "Base"
  eth_decimals: 18

# ---------------------------------------------------------------------------
# FX fallback rates. Used offline / when the free price APIs are unreachable.
# Meaning: 1 USD buys this much of the asset.
# ---------------------------------------------------------------------------
fx:
  # Fallback snapshot 2026-11-20 (live APIs are tried first on every sync).
  usd_btc: 0.000016213
  usd_eth: 0.000572797
  usd_sol: 0.013879251
  btc_price_endpoint: "https://mempool.space/api/v1/prices"
  eth_price_endpoint: "https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=usd"
  sol_price_endpoint: "https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd"

# ---------------------------------------------------------------------------
# On-chain payment watchers (v1). All keyless except Etherscan (free tier,
# key via the ETHERSCAN_API_KEY env var — the chain is simply skipped if the
# env var is absent). A watcher that cannot reach its API is skipped; the
# manual CSV confirmations (v0) always work.
# ---------------------------------------------------------------------------
watchers:
  enabled: true
  auto_confirm: true          # auto-mark paid when an exact on-chain match is found
  lookback_hours: 72          # how far back to scan for the payment
  btc_api: "https://mempool.space"
  sol_rpc: "https://api.mainnet-beta.solana.com"
  eth_api: "https://api.etherscan.io/v2/api"   # multichain Etherscan v2 (Base via chainid)

# ---------------------------------------------------------------------------
# Delivery. One-time download links point at YOUR GitHub Releases (free).
# Replace YOUR_GITHUB_USERNAME. See README.md "Delivery" section.
# ---------------------------------------------------------------------------
delivery:
  releases_base: "https://github.com/itsxwang/cash-register-releases/releases/download"

# ---------------------------------------------------------------------------
# The sellable tools. Prices are one-off USD amounts payable in BTC/ETH/SOL.
# ---------------------------------------------------------------------------
tools:
  crypto-invoice-generator:
    name: "Crypto Invoice Generator"
    blurb: "Professional printable invoices with a BTC/ETH/SOL address + QR for the payer. 100% client-side."
    price_usd: 19
    chains: [eth, sol, btc]
    default_chain: eth
    release_file: "crypto-invoice-generator-v1.1.1.zip"
    landing: "/tools/crypto-invoice-generator/"
    checkout: "/tools/crypto-invoice-generator/checkout.html"
  cron-ping-monitor:
